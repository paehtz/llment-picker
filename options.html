<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title data-i18n="optTitle">LLMent Picker – Settings</title>
<style>
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#14181f;margin:0;padding:16px 20px;min-width:360px;max-width:520px}
  h1{font-size:16px;margin:0 0 14px}
  label{display:block;font-weight:600;margin:14px 0 4px}
  input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:7px 9px;border:1px solid #c9d1dc;border-radius:6px}
  .hint{color:#5b6675;font-size:12.5px;margin-top:4px}
  .row{display:flex;align-items:flex-start;gap:8px;margin-top:14px}
  .row input{margin-top:3px}
  .row label{margin:0;font-weight:600}
  #status{margin-top:16px;font-size:12.5px;color:#1a7f37;min-height:1.2em}
  fieldset{border:0;padding:0;margin:14px 0 0}
  legend{font-weight:600;padding:0;margin-bottom:4px}
  label.radio{display:flex;align-items:flex-start;gap:8px;font-weight:400;margin:4px 0}
  label.radio input{margin-top:3px}
</style>
</head>
<body>
<h1 data-i18n="optTitle">LLMent Picker – Settings</h1>

<label for="subfolder" data-i18n="optSubfolder">Subfolder for HTML files</label>
<input type="text" id="subfolder" placeholder="LLMent Picker">
<div class="hint" data-i18n="optSubfolderHint"></div>

<div class="row">
  <input type="checkbox" id="saveAs">
  <div>
    <label for="saveAs" data-i18n="optSaveAs"></label>
    <div class="hint" data-i18n="optSaveAsHint"></div>
  </div>
</div>

<fieldset id="shotTarget">
  <legend data-i18n="optShot"></legend>
  <label class="radio"><input type="radio" name="shotTarget" value="both"><span data-i18n="optShotBoth"></span></label>
  <label class="radio"><input type="radio" name="shotTarget" value="clipboard"><span data-i18n="optShotClipboard"></span></label>
  <label class="radio"><input type="radio" name="shotTarget" value="file"><span data-i18n="optShotFile"></span></label>
  <div class="hint" data-i18n="optShotHint"></div>
</fieldset>

<div class="row">
  <input type="checkbox" id="cssInHtml">
  <div>
    <label for="cssInHtml" data-i18n="optCss"></label>
    <div class="hint" data-i18n="optCssHint"></div>
  </div>
</div>

<div class="row">
  <input type="checkbox" id="hideHints">
  <div>
    <label for="hideHints" data-i18n="optHideHints"></label>
    <div class="hint" data-i18n="optHideHintsHint"></div>
  </div>
</div>

<div id="status"></div>
<script src="options.js"></script>
</body>
</html>
