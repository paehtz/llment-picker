<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LLMent Picker – Einstellungen</title>
<style>
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#14181f;margin:0;padding:16px 20px;min-width:360px;max-width:520px}
  h1{font-size:16px;margin:0 0 14px}
  label{display:block;font-weight:600;margin:14px 0 4px}
  input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:7px 9px;border:1px solid #c9d1dc;border-radius:6px}
  .hint{color:#5b6675;font-size:12.5px;margin-top:4px}
  .row{display:flex;align-items:flex-start;gap:8px;margin-top:14px}
  .row input{margin-top:3px}
  .row label{margin:0;font-weight:600}
  #status{margin-top:16px;font-size:12.5px;color:#1a7f37;min-height:1.2em}
</style>
</head>
<body>
<h1>LLMent Picker – Einstellungen</h1>

<label for="subfolder">Unterordner für HTML-Dateien</label>
<input type="text" id="subfolder" placeholder="LLMent Picker">
<div class="hint">Erweiterungen dürfen nur in den Download-Ordner des Browsers schreiben. Der Unterordner wird dort angelegt; leer lassen = direkt in den Download-Ordner.</div>

<div class="row">
  <input type="checkbox" id="saveAs">
  <div>
    <label for="saveAs">Beim Speichern „Speichern unter"-Dialog zeigen</label>
    <div class="hint">Aus: Datei landet ohne Nachfrage im Unterordner, der Pfad kommt als fünfte Zeile in die Zwischenablage.</div>
  </div>
</div>

<div id="status"></div>
<script src="options.js"></script>
</body>
</html>
