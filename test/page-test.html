<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Ganze Seite</title>

.band{height:1000px}
.b1{background:#0000ff}.b2{background:#ffff00}.b3{background:#00ffff}.b4{background:#ff00ff}

main{padding-top:60px}
</style></head><body>
<header>Fixierte Kopfleiste</header>
<main><div class="sticky">Sticky</div>
<div class="band b1"></div><div class="band b2"></div><div class="band b3"></div><div class="band b4"></div></main>
<div class="cookie">Cookie-Hinweis</div>
</body></html>
